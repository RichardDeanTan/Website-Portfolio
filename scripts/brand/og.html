<!doctype html>
<!--
  Template for public/og-image.png (the link preview on LinkedIn, WhatsApp, X).
  Rendered at 1200x630 by scripts/brand/make-assets.mjs. Edit the text here, then run `npm run brand`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Poppins';
        font-weight: 500;
        src: url('../../node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-weight: 700;
        src: url('../../node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2') format('woff2');
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-columns: 1fr 430px;
        background: #0b0d10;
        color: #f2f4f7;
        font-family: 'Poppins', sans-serif;
      }

      .text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 0 0 80px;
      }

      .roles {
        color: #38a8e8;
        font-size: 28px;
        font-weight: 500;
      }

      h1 {
        margin-top: 12px;
        font-size: 68px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }

      .headline {
        margin-top: 24px;
        color: #a0a7b4;
        font-size: 21px;
        font-weight: 500;
        white-space: nowrap;
      }

      .facts {
        display: flex;
        gap: 36px;
        margin-top: 44px;
        padding-top: 28px;
        border-top: 2px solid #252a33;
      }

      .fact b {
        display: block;
        color: #38a8e8;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.1;
      }

      .fact span {
        color: #a0a7b4;
        font-size: 18px;
        font-weight: 500;
      }

      .portrait {
        position: relative;
      }

      .brush {
        position: absolute;
        inset: 120px -40px 40px -60px;
        background: #38a8e8;
        opacity: 0.85;
        -webkit-mask: url('../../src/assets/aboutme-bg.png') center / contain no-repeat;
        mask: url('../../src/assets/aboutme-bg.png') center / contain no-repeat;
      }

      .person {
        position: absolute;
        bottom: 0;
        right: 10px;
        height: 590px;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="roles">Data Engineer · Data Scientist · AI Engineer</p>
      <h1>Richard Dean<br />Tanjaya</h1>
      <p class="headline">Data Engineer Intern @ Kalbe Farma · Data Science @ BINUS</p>
      <div class="facts">
        <div class="fact"><b>3</b><span>IEEE papers</span></div>
        <div class="fact"><b>Best Paper</b><span>ITIS 2025</span></div>
        <div class="fact"><b>40+</b><span>data pipelines</span></div>
      </div>
    </div>
    <div class="portrait">
      <div class="brush"></div>
      <img class="person" src="../../src/assets/aboutme-person.png" alt="" />
    </div>
  </body>
</html>
